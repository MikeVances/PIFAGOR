openapi: 3.1.0
info:
  title: PIFAGOR Submit API
  version: "1.0.0"

servers:
  - url: https://900e1808427a.ngrok-free.app

paths:
  /pifagor/submit_card_result:
    post:
      operationId: submitCardResult
      summary: Сохранить результат обработки карточки
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitCardResultRequest"
            example:
              result:
                holding:
                  name: "АО «Куриное Царство»"
                  inn: "1651002812"
                  logo_hint: "Красный логотип с буквами Ч и кругом"
                  parent:
                    name: "Группа Черкизово"
                company:
                  name: "АО «Турбаслинские бройлеры»"
                  inn: "1651002812"
                  production_type:
                    primary: "broiler"
                  region: "Республика Башкортостан"
                  address_full: "452778, Республика Башкортостан, Туймазинский район, с. Дуслык, ул. Комсомольская, 29"
                site:
                  name: "Туймазинское ОП"
                  site_type: "филиал"
                  address_full: "452778, Республика Башкортостан, Туймазинский район, с. Дуслык, ул. Комсомольская, 29"
                  region: "Республика Башкортостан"
                  websites:
                    - "https://www.cherkizovo.com"
                  logo_hint: "Зелёный прямоугольник с белой буквой T"
                contacts:
                  - role: "Руководитель"
                    full_name: "Гайдук Вадим Сергеевич"
                    phone: ["+7 (937) 161-94-39", "+7 (495) 775-05-55 доб. 30375"]
                    email: "v.gayduk@cherkizovo.com"
                  - role: "Ведущий зоотехник"
                    full_name: "Давлетова Эльмира Нурулловна"
                    phone: ["+7 (927) 324-63-08", "+7 (495) 775-05-55 доб. 30374"]
                    email: "e.davletova@cherkizovo.com"
                notes_raw: ""
                _meta:
                  source_hint: "карточка предприятия"
      responses:
        "200":
          description: Результат сохранения
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitCardResultResponse"
  /pifagor/push_next_card:
    post:
      operationId: pushNextCard
      summary: Получить следующую карточку для обработки
      responses:
        "200":
          description: Ссылка на файл карточки или причина отсутствия
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushNextCardResponse"

components:
  schemas:
    SubmitCardResultRequest:
      type: object
      properties:
        filename:
          type: string
          description: Имя файла из очереди (если известно).
        result:
          type: object
          additionalProperties: false
          required:
            - company
            - site
          properties:
            holding:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                inn:
                  type: string
                parent:
                  type: object
                  additionalProperties: false
                  properties:
                    name:
                      type: string
                    inn:
                      type: string
            company:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                inn:
                  type: string
                production_type:
                  type: object
                  additionalProperties: false
                  properties:
                    primary:
                      type: string
                      description: Основной тип производства
                      enum:
                        - broiler
                        - egg
                        - rearing
                        - parent_stock
                        - turkey
                        - duck
                        - mixed
                        - unknown
                address_full:
                  type: string
                postal_code:
                  type: string
                region:
                  type: string
                district:
                  type: string
                locality:
                  type: string
                street:
                  type: string
            site:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                site_type:
                  type: string
                address_full:
                  type: string
                postal_code:
                  type: string
                region:
                  type: string
                district:
                  type: string
                locality:
                  type: string
                street:
                  type: string
                websites:
                  type: array
                  items:
                    type: string
                logo_hint:
                  type: string
                  description: Описание логотипа площадки/бренда
            contacts:
              type: array
              items:
                type: object
                additionalProperties: false
                properties:
                  role:
                    type: string
                  full_name:
                    type: string
                  phone:
                    type: array
                    items:
                      type: string
                  email:
                    type: string
            notes_raw:
              type: string
            _meta:
              type: object
              additionalProperties: false
              properties:
                source_hint:
                  type: string
      required:
        - result

    SubmitCardResultResponse:
      type: object
      properties:
        status:
          type: string
        company_id:
          type: integer
          nullable: true
        error_message:
          type: string
          nullable: true
        queue:
          type: object
          nullable: true
      required:
        - status

    PushNextCardResponse:
      type: object
      properties:
        ok:
          type: boolean
        pushed:
          type: boolean
          nullable: true
        filename:
          type: string
          nullable: true
        file_url:
          type: string
          format: uri
          nullable: true
        reason:
          type: string
          nullable: true
      required:
        - ok
